<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>
  <rect x="60" y="60" width="1480" height="780" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="800" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">OTP Verification Workflow</text>
  <text x="800" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#64748b">Normalized phone flow from registration to successful verification</text>

  <rect x="120" y="215" width="240" height="120" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">User</text>
  <text x="240" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Registers with phone</text>
  <text x="240" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">9176358376</text>

  <rect x="430" y="215" width="260" height="120" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Frontend</text>
  <text x="560" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Normalizes phone</text>
  <text x="560" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">9176358376 → +919176358376</text>

  <rect x="760" y="215" width="300" height="120" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2" filter="url(#shadow)"/>
  <text x="910" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f766e">Backend API</text>
  <text x="910" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Stores OTP securely</text>
  <text x="910" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Key: otp:+919176358376</text>

  <rect x="1120" y="215" width="260" height="120" rx="18" fill="#fefce8" stroke="#facc15" stroke-width="2" filter="url(#shadow)"/>
  <text x="1250" y="260" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#a16207">SMS / OTP</text>
  <text x="1250" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Delivers one-time code</text>
  <text x="1250" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">6-digit code</text>

  <line x1="360" y1="275" x2="430" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="690" y1="275" x2="760" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1060" y1="275" x2="1120" y2="275" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="420" width="1000" height="320" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Verification Phase</text>

  <rect x="350" y="500" width="240" height="120" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">Verify Page</text>
  <text x="470" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Receives normalized phone</text>
  <text x="470" y="597" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">+919176358376</text>

  <rect x="680" y="500" width="250" height="120" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2" filter="url(#shadow)"/>
  <text x="805" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#c2410c">Cache Lookup</text>
  <text x="805" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">Redis or in-memory fallback</text>
  <text x="805" y="597" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">otp:+919176358376</text>

  <rect x="1010" y="500" width="240" height="120" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2" filter="url(#shadow)"/>
  <text x="1130" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">Success</text>
  <text x="1130" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">OTP verified</text>
  <text x="1130" y="597" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748b">Login succeeds</text>

  <line x1="590" y1="560" x2="680" y2="560" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="560" x2="1010" y2="560" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="290" y="670" width="1020" height="40" rx="12" fill="url(#accent)"/>
  <text x="800" y="696" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Key idea: same normalized phone is used for storage and lookup, preventing OTP mismatch failures</text>
</svg>