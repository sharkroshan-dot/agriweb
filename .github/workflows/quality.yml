name: AgriConnect Quality

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

jobs:
  website:
    name: Website lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt
      - name: Run tests
        run: pytest -q

  mobile:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test

  security:
    name: Dependency and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit tooling
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit -r requirements/base.txt
      - name: Check for obvious committed secrets
        shell: bash
        run: |
          ! grep -RInE "(AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]+|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" . --exclude-dir=.git --exclude=package-lock.json
