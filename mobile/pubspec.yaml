name: agriconnect
description: AgriConnect AI Mobile App
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^11.0.0

  # Storage
  shared_preferences: ^2.2.0

  # API & Network
  http: ^1.1.0

  # Payment
  razorpay_flutter: ^1.3.0

  # Realtime chat
  web_socket_channel: ^3.0.0

  # Voice Assistant
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

  # Utilities
  intl: ^0.18.0
  image_picker: ^1.0.0
  file_picker: ^6.1.1
  geolocator: ^12.0.0
  url_launcher: ^6.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/
