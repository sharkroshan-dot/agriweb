services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - mongodb
      - redis
    networks: [agriconnect-network]

  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: agriconnect-website
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks: [agriconnect-network]

  mongodb:
    image: mongo:7.0
    container_name: agriconnect-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: agri
    volumes:
      - mongodb_data:/data/db
    networks: [agriconnect-network]

  redis:
    image: redis:7.2-alpine
    container_name: agriconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [agriconnect-network]

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on: [mongodb, redis]
    networks: [agriconnect-network]

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on: [redis]
    networks: [agriconnect-network]

volumes:
  mongodb_data:
  redis_data:

networks:
  agriconnect-network:
    driver: bridge
