services:
  backend:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    container_name: agriconnect-backend
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/agri?replicaSet=rs0&authSource=admin
      MONGODB_DATABASE: agri
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
    volumes: ["./backend:/app", "/app/__pycache__"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [agriconnect-network]

  website:
    build: { context: ./website, dockerfile: Dockerfile.dev }
    container_name: agriconnect-website
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes: ["./website:/app", "/app/node_modules", "/app/.next"]
    depends_on: [backend]
    networks: [agriconnect-network]

  mongodb:
    image: mongo:7.0
    container_name: agriconnect-mongodb
    entrypoint: ["/bin/bash", "/usr/local/bin/replica-set-entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/replica.key"]
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: agri
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongodb/replica-set-entrypoint.sh:/usr/local/bin/replica-set-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }"
          | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    networks: [agriconnect-network]

  redis:
    image: redis:7.2-alpine
    container_name: agriconnect-redis
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    networks: [agriconnect-network]

  celery:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    container_name: agriconnect-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:-change-me}@mongodb:27017/agri?replicaSet=rs0&authSource=admin
      MONGODB_DATABASE: agri
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes: ["./backend:/app"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [agriconnect-network]

  celery-beat:
    build: { context: ./backend, dockerfile: Dockerfile.dev }
    container_name: agriconnect-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes: ["./backend:/app"]
    depends_on: [redis]
    networks: [agriconnect-network]

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  agriconnect-network:
    driver: bridge
