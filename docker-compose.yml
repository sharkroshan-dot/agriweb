services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - mongodb
      - redis
    networks:
      - agriconnect-network

  # Frontend Website
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: agriconnect-website
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - agriconnect-network

  # Mobile (Flutter Development)
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile.dev
    container_name: agriconnect-mobile
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/build
    networks:
      - agriconnect-network

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: agriconnect-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=agri
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - agriconnect-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: agriconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agriconnect-network

  # Celery Worker
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - agriconnect-network

  # Celery Beat (Scheduled Tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agriconnect-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - agriconnect-network

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:1.25-alpine
    container_name: agriconnect-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - website
    networks:
      - agriconnect-network

  # Grafana (Monitoring)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: agriconnect-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - agriconnect-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: agriconnect-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - agriconnect-network

volumes:
  mongodb_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  agriconnect-network:
    driver: bridge
